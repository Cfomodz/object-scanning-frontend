<!DOCTYPE html>
<html>
<head>
    <title>Object Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="status-container">
        <h1>Object Scanner Status</h1>
        <div class="preview-container">
            <div class="preview-box">
                <video id="live-view" class="preview-image" autoplay muted></video>
            </div>
            <div class="preview-box">
                <img id="last-captured-view" class="preview-image" alt="Last Captured Image">
            </div>
        </div>
        <div class="controls">
            <button id="start-capture" class="btn">Stop Capture</button>
            <button id="rotate-btn">Rotate</button>
            <button id="refresh-settings-btn">Refresh Camera Settings</button>
            <div class="resolution-selector">
                <label for="resolution-select">Resolution:</label>
                <select id="resolution-select" class="resolution-dropdown">
                    <option value="320x240">320x240</option>
                    <option value="640x480" selected>640x480 (VGA)</option>
                    <option value="800x600">800x600 (SVGA)</option>
                    <option value="1024x768">1024x768 (XGA)</option>
                    <option value="1280x720">1280x720 (HD 720p)</option>
                    <option value="1280x960">1280x960</option>
                    <option value="1600x1200">1600x1200 (UXGA)</option>
                    <option value="1920x1080">1920x1080 (Full HD)</option>
                    <option value="2048x1536">2048x1536 (QXGA)</option>
                    <option value="2592x1944">2592x1944 (5MP)</option>
                    <option value="3840x2160">3840x2160 (4K UHD)</option>
                </select>
            </div>
            <div class="profile-manager">
                <h3>Camera Profiles</h3>
                <div class="profile-controls">
                    <div class="profile-row">
                        <input type="text" id="profile-name" placeholder="Profile name..." class="profile-input">
                        <button id="save-profile-btn" class="btn btn-success">Save Profile</button>
                    </div>
                    <div class="profile-row">
                        <select id="profile-select" class="profile-dropdown">
                            <option value="">-- Select Profile --</option>
                        </select>
                        <button id="load-profile-btn" class="btn btn-primary">Load</button>
                        <button id="delete-profile-btn" class="btn btn-danger">Delete</button>
                    </div>
                </div>
            </div>
            <div id="dynamic-controls" class="dynamic-controls-container">
                <!-- Dynamic camera controls will be inserted here -->
            </div>
        </div>
        <div class="status-items">
            <div class="status-item" id="status">ready</div>
        </div>
        <div class="debug-console">
            <div class="debug-header">
                <h3>Debug Console</h3>
                <button id="clear-debug" class="btn">Clear</button>
            </div>
            <div id="debug-log" class="debug-messages"></div>
        </div>
    </div>

    <!-- Include main.js before OpenCV.js -->
    <script src="{{ url_for('static', filename='js/main.js') }}?v=5"></script>
    <!-- Include OpenCV.js without the async attribute -->
    <script src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
</body>
</html>
